name: Check Autograder Failures

on:
  schedule:
    - cron: "0 5 * * *" # every day at 9:00 PM PST (5:00 AM UTC)
  workflow_dispatch: # allow manual trigger

jobs:
  check-failures:
    runs-on: ubuntu-latest

    env:
      COURSE_ID: "1359539"
      ASSIGNMENT_ID: "8518462"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4 python-dotenv rich

      - name: Write cookies file
        env:
          COOKIES_JSON: ${{ secrets.COOKIES_JSON }}
        run: echo "$COOKIES_JSON" > cookies.json

      - name: Check and regrade failed submissions
        run: python check_autograder_failures.py $COURSE_ID $ASSIGNMENT_ID
